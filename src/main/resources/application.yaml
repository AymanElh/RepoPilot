spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/repopilot
    username: repopilot
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  ai:
    model:
      chat: ollama
      embedding: google-genai

    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.8-flash
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 1536

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:1.5b
          temperature: 0.2
          num-ctx: 8192
          num-predict: 512

    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store

management:
  endpoints:
    web:
      exposure:
        include: health,info
